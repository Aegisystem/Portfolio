name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Solo se publican los archivos del sitio. PRODUCT.md, DESIGN.md,
      # .impeccable/ y el resto del material de trabajo no se sirven.
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp index.html 404.html robots.txt _site/
          cp -R assets _site/
          touch _site/.nojekyll
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
